name: Actualizar compras

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["docs/index.html", "config/**"]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Bajar novedades de ARCE
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/ingesta.py
      - name: Guardar cambios
        run: |
          git config user.name "monitor-compras"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data data
          git diff --cached --quiet || git commit -m "Datos $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  publicar:
    needs: actualizar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
